name: Upstream rebuild
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild_pinned:
        description: Rebuild the currently pinned pair
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: upstream-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Check published npm versions
        id: probe
        env:
          PINNED: ${{ inputs.rebuild_pinned }}
        run: |
          args=()
          if [[ "$PINNED" == true ]]; then args+=(--pinned); fi
          python scripts/upstream_candidate.py probe "${args[@]}"
      - name: Identify this source and pair
        id: cache-key
        if: steps.probe.outputs.build == 'true'
        env:
          DSH: ${{ steps.probe.outputs.dsh }}
          TUI: ${{ steps.probe.outputs.tui }}
        run: echo "value=upstream-candidate-$GITHUB_SHA-$DSH-$TUI" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: built
        if: github.event_name == 'schedule' && steps.probe.outputs.build == 'true'
        with:
          path: .build/upstream-attempt
          key: ${{ steps.cache-key.outputs.value }}
          lookup-only: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.probe.outputs.build == 'true' && steps.built.outputs.cache-hit != 'true'
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Resolve candidate pins and validate patch preimages
        id: prepare
        if: steps.probe.outputs.build == 'true' && steps.built.outputs.cache-hit != 'true'
        env:
          DSH: ${{ steps.probe.outputs.dsh }}
          TUI: ${{ steps.probe.outputs.tui }}
        run: |
          python scripts/upstream_candidate.py prepare --dsh "$DSH" --tui "$TUI"
          python scripts/check_inputs.py
          mkdir -p .build/upstream-inputs
          cp build.json .build/upstream-inputs/
          git diff --binary -- build.json runtime/package.json runtime/package-lock.json patches/integration.json > .build/upstream-inputs/upstream.patch
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: upstream-inputs
          path: .build/upstream-inputs/
          include-hidden-files: true
          if-no-files-found: error
  native:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-inputs
          path: .build/upstream-inputs
      - name: Apply the same frozen inputs on each runner
        run: |
          patch=.build/upstream-inputs/upstream.patch
          test -f "$patch"
          if [[ -s "$patch" ]]; then git apply --whitespace=error "$patch"; fi
          cmp build.json .build/upstream-inputs/build.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
      - name: Build and validate the candidate executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/build.py --candidate --target "$TARGET"
          tar -C "dist/$TARGET" -cf "dist/$TARGET/devneya-candidate-$TARGET.tar" devneya build-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: dist/${{ matrix.target }}/devneya-candidate-${{ matrix.target }}.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  record:
    needs: [prepare, native]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - run: mkdir -p .build && touch .build/upstream-attempt
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build/upstream-attempt
          key: ${{ needs.prepare.outputs.cache-key }}
